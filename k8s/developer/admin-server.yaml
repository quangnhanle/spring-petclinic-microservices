apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: developer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      containers:
        - name: admin-server
          image: nhanleeq/spring-petclinic-admin-server:main
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: admin-server
  namespace: developer
spec:
  selector:
    app: admin-server
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
