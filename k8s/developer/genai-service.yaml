apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: developer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      containers:
        - name: genai-service
          image: nhanleeq/spring-petclinic-genai-service:main
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: developer
spec:
  selector:
    app: genai-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP